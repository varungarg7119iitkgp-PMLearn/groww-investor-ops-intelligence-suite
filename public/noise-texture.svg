<!-- Seamless grain noise texture  15% opacity, blend: overlay on aurora mesh -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <filter id="grain" x="0%" y="0%" width="100%" height="100%"
          color-interpolation-filters="linearRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.65"
      numOctaves="4"
      stitchTiles="stitch"
      result="noise"
    />
    <feColorMatrix
      type="saturate"
      values="0"
      in="noise"
      result="grayNoise"
    />
    <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend" />
    <feComposite in="blend" in2="SourceGraphic" operator="in" />
  </filter>
  <rect width="100%" height="100%" fill="rgba(255,255,255,0.15)" filter="url(#grain)" />
</svg>
