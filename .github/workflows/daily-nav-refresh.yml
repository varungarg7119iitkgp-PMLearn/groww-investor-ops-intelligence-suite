name: Daily Fund Refresh (Groww scrape)

# Runs every day at 19:30 IST (14:00 UTC) — after Groww publishes the
# evening NAV for that trading day. The catch-up run at 03:30 UTC
# (09:00 IST) covers any funds whose NAV was delayed.
on:
  schedule:
    - cron: "0 14 * * 1-5"   # 19:30 IST, Mon-Fri (post-market evening NAV)
    - cron: "30 3 * * 2-6"   # 09:00 IST, Tue-Sat (delayed/catch-up NAV)
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "manual"

jobs:
  refresh-funds:
    name: Scrape Groww + Refresh fund_chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Scrape Groww + replace fund_chunks + update NAV
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run refresh:funds:ci

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily Groww refresh failed. Check the previous step's logs."
          echo "Manual rerun: Actions tab -> Daily Fund Refresh -> Run workflow"
