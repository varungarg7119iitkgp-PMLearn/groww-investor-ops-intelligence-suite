name: Daily NAV Refresh

# Runs every trading day at 19:15 IST (13:45 UTC) — after AMFI updates
# the feed post-market close (~18:30 IST). Also runs 07:30 IST (02:00 UTC)
# to catch any delayed updates from the previous evening.
on:
  schedule:
    - cron: "45 13 * * 1-5"   # 19:15 IST, Mon–Fri
    - cron: "0 2  * * 2-6"    # 07:30 IST, Tue–Sat (catches delayed prior-day NAV)
  workflow_dispatch:           # allow manual trigger from GitHub UI
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "manual"

jobs:
  refresh-nav:
    name: Refresh Mutual Fund NAVs from AMFI
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger NAV refresh
        id: refresh
        run: |
          echo "Calling /api/cron/refresh-nav on production..."
          RESPONSE=$(curl -sL -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/refresh-nav")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          echo "response=$BODY" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ NAV refresh failed with status $HTTP_STATUS"
            exit 1
          fi

          UPDATED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('updated',0))" 2>/dev/null || echo "?")
          echo "✅ Updated $UPDATED / 20 fund NAVs"

      - name: Verify freshness
        if: success()
        run: |
          echo "Verifying Supabase data is fresh..."
          HEALTH=$(curl -sL "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/refresh-nav")
          echo "Health: $HEALTH"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::NAV refresh failed. Check AMFI feed or Supabase connectivity."
          echo "Manual fix: POST /api/cron/refresh-nav with Authorization: Bearer <CRON_SECRET>"
